<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>联网设置</title>
  <link rel="stylesheet" href="online.css">
</head>
<body>
  <form id="form">
    <h1>联网设置 ♡</h1>
    <p>对方看到的名字：<b id="name"></b></p>
    <small>就是「小设置」里的「怎么称呼你」，想改去那里改。</small>
    <label>配对码<input id="code" minlength="4" maxlength="64" required placeholder="两个人填一样的，至少 4 个字"></label>
    <div class="row left">
      <button type="button" id="random">随机生成配对码</button>
      <button type="button" id="copy">复制</button>
      <span id="copied" role="status"></span>
    </div>
    <details id="advanced">
      <summary>服务器地址</summary>
      <label>服务器地址<input id="server" placeholder="desk-pets-relay.你的名字.workers.dev"></label>
      <small id="server-hint"></small>
    </details>
    <small>只会传「摸摸」「戳一下」和是否在线，不传屏幕、窗口或键盘信息。</small>
    <p id="error" role="alert"></p>
    <div class="row">
      <button type="button" id="cancel">取消</button>
      <button type="submit">保存并连接</button>
    </div>
  </form>
  <script src="online.js"></script>
</body>
</html>
