plugins { id 'com.android.application' }
def fixedStore = System.getenv('ANDROID_KEYSTORE_PATH')
def fixedPassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def fixedSigningReady = fixedStore && fixedPassword
android {
    namespace 'com.lumi.deskpets'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lumi.deskpets'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9-preview'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        fixedRelease {
            if (fixedSigningReady) {
                storeFile file(fixedStore)
                storePassword fixedPassword
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'deskpets'
                keyPassword fixedPassword
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.fixedRelease } }
    sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/petAssets')] } }
}
tasks.register('preparePetAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'android/scripts/prepare-assets.cjs', layout.buildDirectory.dir('generated/petAssets').get().asFile.absolutePath
    inputs.dir(rootProject.file('../桌宠素材'))
    inputs.file(rootProject.file('../renderer/combos.js'))
    inputs.file(rootProject.file('scripts/prepare-assets.cjs'))
    outputs.dir(layout.buildDirectory.dir('generated/petAssets'))
}
tasks.named('preBuild').configure { dependsOn 'preparePetAssets' }
tasks.register('requireFixedSigning') {
    doLast {
        if (!fixedSigningReady) throw new GradleException('Release requires a persistent signing keystore. Do not publish a debug APK as an update.')
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'requireFixedSigning' }
