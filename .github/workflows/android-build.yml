name: Android 测试安装包
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'renderer/combos.js', '桌宠素材/**', '.github/workflows/android-build.yml']
permissions:
  contents: write
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm test
      - name: 检查联动分类与切换
        run: |
          mkdir -p /tmp/pet-tests
          javac -encoding UTF-8 -d /tmp/pet-tests android/app/src/main/java/com/lumi/deskpets/AppCompanion.java android/app/src/main/java/com/lumi/deskpets/Perch.java android/app/src/main/java/com/lumi/deskpets/SurfaceRules.java android/tests/AppCompanionTest.java
          java -cp /tmp/pet-tests com.lumi.deskpets.AppCompanionTest
      - name: 编译和检查安卓版
        working-directory: android
        run: gradle :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lijianxue-android-preview
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: 发布安卓测试版（版本号未变则保留已有发布）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash android/scripts/publish-preview.sh
