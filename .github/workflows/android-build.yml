name: Android 测试安装包
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'renderer/combos.js', '桌宠素材/**', '.github/workflows/android-build.yml']
permissions:
  contents: write
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm test
      - name: 检查联动分类与切换
        run: |
          mkdir -p /tmp/pet-tests
          javac -encoding UTF-8 -d /tmp/pet-tests android/app/src/main/java/com/lumi/deskpets/AppCompanion.java android/app/src/main/java/com/lumi/deskpets/Perch.java android/app/src/main/java/com/lumi/deskpets/SurfaceRules.java android/app/src/main/java/com/lumi/deskpets/DeliveryRules.java android/app/src/main/java/com/lumi/deskpets/IslandHang.java android/app/src/main/java/com/lumi/deskpets/UpdateRules.java android/app/src/main/java/com/lumi/deskpets/Weather.java android/app/src/main/java/com/lumi/deskpets/TeaseRules.java android/app/src/main/java/com/lumi/deskpets/CalendarRules.java android/tests/AppCompanionTest.java
          java -cp /tmp/pet-tests com.lumi.deskpets.AppCompanionTest
          javac -encoding UTF-8 -cp /tmp/pet-tests -d /tmp/pet-tests android/app/src/main/java/com/lumi/deskpets/UpdateHttp.java android/tests/UpdateHttpTest.java
          java -cp /tmp/pet-tests com.lumi.deskpets.UpdateHttpTest
      - name: 编译和检查安卓版
        working-directory: android
        run: gradle :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lijianxue-android-preview
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: 构建固定签名安装包（已配置时）
        # Only release APKs signed with the privately stored persistent key.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            umask 077
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/deskpets-release.p12"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            (cd android && gradle :app:assembleRelease :app:lintRelease)
            echo "ANDROID_SIGNED_APK=$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          fi
      - name: 发布固定签名 APK（已有版本不替换）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash android/scripts/publish-preview.sh
