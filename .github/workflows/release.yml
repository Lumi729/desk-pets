# 自动发布：推送 v 开头的标签（比如 v1.1.0）时，在云端的 Windows 上打包安装包，发布到 GitHub Releases。
# 装好的桌宠会从 Releases 自动下载新版本（electron-updater 读的是一起上传的 latest.yml）。
name: 打包发布

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 检查标签和版本号一致
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 package.json 里的版本 $version 对不上"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: 打包并发布到 Releases
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
