# 自动发布：package.json 里的版本号变了（推到 main 上），或者推送 v 开头的标签（比如 v1.1.0）时，
# 在云端的 Windows 上打包安装包，发布到 GitHub Releases（会自动建好 v<版本号> 标签）。
# 版本号没变的普通推送会直接跳过，不会重复发布。
# 这个版本打包失败了、修好以后想重新打包：改一下这个文件推上去就会再跑一次（已经发布完整的版本会跳过）。
# 装好的桌宠会从 Releases 自动下载新版本（electron-updater 读的是一起上传的 latest.yml）。
name: 打包发布

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: 看看这个版本发布过没有
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 package.json 里的版本 $version 对不上"
            exit 1
          fi
          # 以前打包时留下的草稿都删掉（只删草稿，不动已经公开的）
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q '.[] | select(.draft) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # 已经完整发布过（有安装包和 latest.yml）就跳过；没发完整的删掉重来（标签保留）
          assets=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(",")' 2>/dev/null || echo "none")
          if [[ "$assets" == *latest.yml* && "$assets" == *"setup-$version.exe"* ]]; then
            echo "v$version 已经发布过了，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$assets" != "none" ]]; then
            echo "v$version 上次没发完整，删掉重新发"
            gh release delete "v$version" --repo "$GITHUB_REPOSITORY" --yes
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.version.outputs.skip != 'true'
      - run: npm test
        if: steps.version.outputs.skip != 'true'
      - name: 打上标签，先建好一个草稿
        if: steps.version.outputs.skip != 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          # 先建好草稿，打包工具就只会往这一个里上传，不会同时建出两个
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "梨间雪桌宠 $tag" --notes "千千梨梨桌宠 $tag"
      - name: 打包并上传
        if: steps.version.outputs.skip != 'true'
        run: npx electron-builder --win nsis --publish always
      - name: 检查文件都在，再正式公开
        if: steps.version.outputs.skip != 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(",")')
          echo "上传了：$assets"
          if [[ "$assets" != *latest.yml* || "$assets" != *"setup-${{ steps.version.outputs.version }}.exe"* ]]; then
            echo "::error::安装包或 latest.yml 没传上去，先不公开"
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
