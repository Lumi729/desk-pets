# 自动发布：package.json 里的版本号变了（推到 main 上），或者推送 v 开头的标签（比如 v1.1.0）时，
# 在云端的 Windows 上打包安装包，发布到 GitHub Releases（会自动建好 v<版本号> 标签）。
# 版本号没变的普通推送会直接跳过，不会重复发布。
# 装好的桌宠会从 Releases 自动下载新版本（electron-updater 读的是一起上传的 latest.yml）。
name: 打包发布

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 看看这个版本发布过没有
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 package.json 里的版本 $version 对不上"
            exit 1
          fi
          # 已经完整发布过（有 latest.yml）就跳过；上次没发完的半成品删掉重来（标签保留）
          assets=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets,isDraft --jq '(.isDraft|tostring) + " " + ([.assets[].name] | join(","))' 2>/dev/null || echo "none")
          if [[ "$assets" == false*latest.yml* ]]; then
            echo "v$version 已经发布过了，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$assets" != "none" ]]; then
            echo "v$version 上次没发完，删掉重新发"
            gh release delete "v$version" --repo "$GITHUB_REPOSITORY" --yes
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.version.outputs.skip != 'true'
      - run: npm test
        if: steps.version.outputs.skip != 'true'
      - name: 打上 v<版本号> 标签
        if: steps.version.outputs.skip != 'true' && github.ref_type != 'tag'
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
      - name: 打包并发布到 Releases
        if: steps.version.outputs.skip != 'true'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 全部上传好了，正式公开
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
