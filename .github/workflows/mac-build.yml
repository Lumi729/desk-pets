name: Mac 兼容检查与测试安装包
on:
  workflow_call:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 启动真实桌宠窗口
        run: npx electron scripts/mac-smoke.cjs
      - name: 制作 Apple 芯片和 Intel 测试安装包
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
